spring.application.name=springai-tools-time
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.ai.openai.api-key=${OPENAI_API_KEY}

# false (default): tool RuntimeExceptions → error message to the model (recoverable)
# true: tool errors bubble to the HTTP caller instead
spring.ai.tools.throw-exception-on-error=false

# Training: see advisor + tool activity in the console
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.candidjava.toolstime=INFO
