spring.application.name=springai-tools-helpdesk
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.ai.openai.api-key=${OPENAI_API_KEY}

# Training: see advisor + tool activity in the console
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.candidjava.toolshelpdesk=INFO

# H2 for ticket persistence (tool side effects)
spring.datasource.url=jdbc:h2:file:~/springai-tools-helpdesk;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
