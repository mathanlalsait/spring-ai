spring.application.name=springai-chatmemory
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

spring.ai.openai.api-key=${OPENAI_API_KEY}

# Show advisor chain activity during live demos
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.candidjava.chatmemory=INFO

# H2 file DB for JDBC-backed chat memory (separate from other labs)
spring.datasource.url=jdbc:h2:file:~/springai-chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Create Spring AI chat-memory JDBC tables on startup
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
